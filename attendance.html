<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Kehadiran Kursus | EDHKN</title>
    <!-- Google Fonts: Inter & Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #050914; /* Hitam kebiruan sangat mendalam */
            --bg-surface: rgba(255, 255, 255, 0.03);
            --bg-card: rgba(15, 23, 42, 0.6);
            --accent: #D4AF37; /* Emas Eksklusif */
            --accent-glow: rgba(212, 175, 55, 0.5);
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(212, 175, 55, 0.5);
            --radius-xl: 24px;
            --radius-lg: 16px;
            --radius-md: 10px;
            --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- ANIMATED BACKGROUND BLOBS --- */
        .bg-blobs {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }
        .blob {
            position: absolute;
            filter: blur(90px);
            opacity: 0.6;
            border-radius: 50%;
            animation: float 10s infinite alternate ease-in-out;
        }
        .blob-1 {
            top: -10%; left: -10%;
            width: 500px; height: 500px;
            background: rgba(212, 175, 55, 0.12);
        }
        .blob-2 {
            bottom: -20%; right: -10%;
            width: 600px; height: 600px;
            background: rgba(14, 165, 233, 0.08);
            animation-delay: -5s;
        }
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }

        /* --- NAVIGASI TERAPUNG DENGAN BUTANG HOME --- */
        nav {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1000px;
            background: rgba(10, 15, 30, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            padding: 10px 20px 10px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            animation: slideDown 0.8s ease-out forwards;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
        }

        .dept-logo {
            height: 38px;
            width: auto;
            object-fit: contain;
            border-radius: 50%;
            background: var(--text-main);
            padding: 2px;
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-main);
            line-height: 1.15;
        }

        .logo-text span {
            display: block;
            font-size: 0.68rem;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            color: var(--accent);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .nav-home-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: var(--accent);
            padding: 8px 16px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: var(--transition);
            white-space: nowrap;
        }

        .nav-home-btn svg {
            width: 16px;
            height: 16px;
        }

        .nav-home-btn:hover {
            background: var(--accent);
            color: var(--bg-base);
            box-shadow: 0 0 16px var(--accent-glow);
            transform: translateY(-1px);
        }

        /* --- MAIN CONTAINER --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 140px 5% 80px;
            position: relative;
            z-index: 10;
        }

        .header-content {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .kicker {
            display: inline-block;
            padding: 6px 18px;
            background: linear-gradient(90deg, rgba(212,175,55,0.1), rgba(212,175,55,0.02));
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 100px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
            font-size: 0.75rem;
            margin-bottom: 15px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.2rem, 5vw, 3.5rem);
            line-height: 1.1;
            margin-bottom: 15px;
            font-weight: 700;
            background: linear-gradient(to bottom right, #FFFFFF 30%, #94A3B8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-content p {
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto;
            font-size: 1.05rem;
        }

        /* --- FORM CONTAINER (GLASSMORPHISM) --- */
        .form-container {
            width: 100%;
            max-width: 750px;
            background: var(--bg-surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            animation: fadeInUp 0.8s ease-out 0.2s forwards;
            opacity: 0; transform: translateY(20px);
        }

        .notice {
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 15px 20px;
            border-radius: var(--radius-md);
            margin-bottom: 30px;
            font-size: 0.9rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-head {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .section-head h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: var(--text-main);
            margin-bottom: 5px;
        }

        .section-head p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .section-body {
            margin-bottom: 40px;
        }

        .field { margin-bottom: 22px; }
        .field:last-child { margin-bottom: 0; }
        
        label, .question {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            letter-spacing: 0.3px;
        }

        .field-row { display: grid; grid-template-columns: 1fr; gap: 22px; margin-bottom: 22px; }
        @media (min-width: 600px) { .field-row { grid-template-columns: 1fr 1fr; } }

        input[type=text], input[type=email], input[type=tel], select {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            transition: var(--transition);
        }

        input::placeholder { color: rgba(148, 163, 184, 0.5); }
        select option { background: var(--bg-base); color: var(--text-main); }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
        }

        /* CUSTOM RADIO BUTTONS */
        .choice-list { display: grid; gap: 12px; }
        .choice-list label {
            display: flex;
            gap: 12px;
            align-items: center;
            font-weight: 400;
            margin: 0;
            cursor: pointer;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            transition: var(--transition);
        }
        .choice-list label:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .choice-list label:has(input:checked) {
            border-color: var(--accent);
            background: rgba(212, 175, 55, 0.08);
            color: var(--accent);
        }
        .choice-list input[type="radio"] {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            margin: 0;
            position: relative;
            transition: var(--transition);
        }
        .choice-list input[type="radio"]:checked {
            border-color: var(--accent);
        }
        .choice-list input[type="radio"]:checked::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 10px; height: 1
